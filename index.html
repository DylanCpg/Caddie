<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Caddie, liste de courses</title>
<meta name="description" content="Une liste de courses qui apprend ce qu’il vous faut et vous le rappelle avant la panne.">
<meta name="theme-color" content="#0A0F1C">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caddie">
<style>
:root{
  color-scheme: dark;
  --paper:#0A0F1C;
  --outer:#05080F;
  --card:#111A2C;
  --raise:#17223A;
  --ink:#E8EDF7;
  --ink-2:#8F9BB5;
  --line:#1E2A45;
  --accent:#5B93FF;
  --accent-ink:#06101F;
  --accent-soft:rgba(91,147,255,.14);
  --mark:rgba(91,147,255,.42);
  --go:#5B93FF;
  --go-ink:#06101F;
  --ok:#4ADE9B;
  --danger:#FF7B8A;
  --focus:#9DBDFF;
  --radius:18px;
  --serif:ui-serif,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--outer);
  color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;
  line-height:1.4;
  -webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:10px}
[hidden]{display:none !important}

#app{
  height:100dvh;
  max-width:640px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  background:var(--paper);
  position:relative;
}

/* En-tête */
.top{
  padding:calc(env(safe-area-inset-top,0px) + 18px) 22px 14px;
  flex:none;
}
.top h1{
  margin:0;
  font-family:var(--serif);
  font-size:2.5rem;
  line-height:1;
  font-weight:600;
  letter-spacing:-0.02em;
}
.top .sub{margin:8px 0 0;color:var(--ink-2);font-size:.95rem}
.progress{
  margin-top:14px;
  height:4px;
  border-radius:2px;
  background:var(--line);
  overflow:hidden;
}
.progress i{
  display:block;height:100%;
  background:var(--accent);
  border-radius:2px;
  transition:width .3s ease;
}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pill{
  flex:none;font-size:.78rem;font-weight:600;padding:5px 11px;border-radius:99px;
  border:1px solid var(--line);background:var(--card);color:var(--ink-2);
  display:inline-flex;align-items:center;gap:7px;
}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink-2)}
.pill.ok{color:var(--ink)}
.pill.ok::before{background:var(--ok);box-shadow:0 0 0 3px rgba(74,222,155,.16)}
.pill.bad::before{background:var(--danger)}

/* Contenu */
main{
  flex:1;
  overflow-y:auto;
  padding:2px 16px 32px;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}
main h2{
  margin:24px 6px 8px;
  font-size:.92rem;
  font-weight:600;
  letter-spacing:.01em;
  color:var(--ink-2);
  display:flex;align-items:center;gap:8px;
}
main h2 .n{
  font-weight:600;font-size:.75rem;
  background:var(--raise);color:var(--ink-2);
  border-radius:99px;padding:1px 8px;
}
ul.list{
  list-style:none;margin:0;padding:0;
  background:var(--card);
  border-radius:var(--radius);
  border:1px solid var(--line);
  overflow:hidden;
}
ul.list > li + li{border-top:1px solid var(--line)}

/* Articles */
.item{display:flex;align-items:center;min-height:58px;padding:4px 6px 4px 8px;gap:4px}
.check{flex:none;width:48px;height:48px;display:grid;place-items:center}
.check span{
  width:26px;height:26px;border-radius:50%;
  border:2px solid #3A4868;
  display:grid;place-items:center;
  color:transparent;
  transition:background .15s ease,border-color .15s ease,transform .15s ease;
}
.check:active span{transform:scale(.88)}
.check svg{width:15px;height:15px}
.item.done .check span{background:var(--go);border-color:var(--go);color:var(--go-ink)}
.item .txtcol{flex:1;min-width:0;display:flex;flex-direction:column}
.item .name{font-size:1.04rem;font-weight:500;overflow-wrap:anywhere}
.item .by{color:var(--ink-2);font-size:.8rem}
.item.done .name{text-decoration:line-through;color:var(--ink-2)}
.item .qty{
  font-weight:600;font-size:.82rem;
  background:var(--accent-soft);color:var(--accent);
  border-radius:99px;padding:2px 10px;margin-right:2px;
}
.rm{flex:none;width:44px;height:44px;display:grid;place-items:center;color:var(--ink-2);border-radius:50%;opacity:.75}
.rm svg{width:17px;height:17px}
.rm:active{background:var(--raise)}
.item.flash{animation:flash 1.3s ease-out}
@keyframes flash{from{background:var(--accent-soft)}to{background:transparent}}

/* À prévoir : le trait de surligneur bleu */
.plan{margin-top:10px}
.plan h2{
  margin:14px 6px 2px;color:var(--ink);
  font-family:var(--serif);font-size:1.45rem;font-weight:600;letter-spacing:-0.01em;
}
.plan .hint{margin:0 6px 10px;color:var(--ink-2);font-size:.88rem}
.plan ul.list{background:#0F1A33;border-color:rgba(91,147,255,.35)}
.sug{display:flex;align-items:stretch}
.sug-main{
  flex:1;display:flex;align-items:center;gap:12px;
  text-align:left;padding:12px 6px 12px 16px;min-height:64px;min-width:0;
}
.sug-main .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.mark{
  align-self:flex-start;
  font-weight:700;font-size:1.08rem;
  background:linear-gradient(transparent 62%,var(--mark) 62%,var(--mark) 90%,transparent 90%);
  padding:0 3px;margin-left:-3px;
  color:var(--ink);
}
.meta{color:var(--ink-2);font-size:.84rem}
.plus{
  flex:none;width:38px;height:38px;border-radius:12px;
  background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;
}
.plus svg{width:18px;height:18px}
.sug-x{flex:none;width:44px;color:var(--ink-2);display:grid;place-items:center;opacity:.75}
.sug-x svg{width:15px;height:15px}

.ghost{
  display:block;margin:12px auto 0;
  padding:10px 18px;border-radius:99px;
  color:var(--ink-2);font-weight:600;font-size:.9rem;
  border:1px solid var(--line);background:var(--card);
}
.empty{
  margin:28px 6px;padding:24px 20px;border-radius:var(--radius);
  border:1.5px dashed var(--line);color:var(--ink-2);text-align:center;
}
.empty b{display:block;color:var(--ink);font-family:var(--serif);font-size:1.25rem;font-weight:600;margin-bottom:6px}

/* Historique */
.hrow{display:flex;align-items:center;gap:10px;padding:14px 8px 14px 16px}
.hrow .txt{flex:1;min-width:0}
.hrow .t{font-weight:600;font-size:1.04rem}
.hrow .r{color:var(--accent);font-size:.8rem;font-weight:500}
.hrow .d{color:var(--ink-2);font-size:.86rem;margin-top:2px}
.btn{
  flex:none;padding:9px 16px;border-radius:12px;font-weight:600;font-size:.9rem;
  background:var(--accent);color:var(--accent-ink);min-height:40px;
}
.btn:active{filter:brightness(.92)}
.btn.soft{background:var(--raise);color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.danger{background:transparent;color:var(--danger);border:1px solid rgba(255,123,138,.5)}

/* Réglages */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-top:8px}
.card p{margin:0 0 12px;color:var(--ink-2);font-size:.92rem}
.card p:last-child{margin-bottom:0}
.card b{color:var(--ink)}
.card .row{display:flex;flex-wrap:wrap;gap:8px}
.orow{display:flex;align-items:center;gap:6px;padding:4px 4px 4px 16px;min-height:52px}
.orow .nm{flex:1;font-weight:500}
.arrow{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--ink)}
.arrow svg{width:18px;height:18px}
.arrow[disabled]{opacity:.25;cursor:default}
.arrow:not([disabled]):active{background:var(--raise)}
.code{
  font-size:1.8rem;font-weight:700;letter-spacing:.07em;color:var(--accent);
  font-variant-numeric:tabular-nums;padding:2px 0 12px;user-select:all;
}
.field{
  width:100%;height:46px;padding:0 14px;border-radius:12px;
  border:1px solid var(--line);background:var(--raise);color:var(--ink);font-size:1rem;
}
.field:focus{outline:none;border-color:var(--accent)}
.join{display:flex;gap:8px}
.join .field{flex:1;min-width:0;text-transform:uppercase;letter-spacing:.05em}

/* Zone d’ajout */
.dock{
  flex:none;
  background:rgba(17,26,44,.88);
  -webkit-backdrop-filter:blur(18px);
  backdrop-filter:blur(18px);
  border-top:1px solid var(--line);
  border-radius:22px 22px 0 0;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
#typing{padding:12px 14px 0;display:flex;flex-direction:column;gap:8px}
#chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;padding:8px 14px;border-radius:12px;
  background:var(--raise);border:1px solid var(--line);font-weight:500;font-size:.92rem;
}
.chip:active{border-color:var(--accent)}
.pick{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:.88rem}
.pick select{
  flex:1;min-width:0;padding:8px 10px;border-radius:10px;
  background:var(--raise);border:1px solid var(--line);color:var(--ink);
}
#addform{display:flex;gap:8px;padding:12px 14px;align-items:center}
#in{
  flex:1;min-width:0;height:48px;padding:0 16px;border-radius:16px;
  background:var(--raise);border:1px solid var(--line);color:var(--ink);font-size:1rem;
}
#in::placeholder{color:var(--ink-2)}
#in:focus{outline:none;border-color:var(--accent)}
.round{
  flex:none;width:48px;height:48px;border-radius:16px;display:grid;place-items:center;
  border:1px solid var(--line);background:var(--raise);
}
.round svg{width:22px;height:22px}
.round.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.round.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* Onglets */
.tabs{display:flex}
.tabs button{
  position:relative;
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:10px 4px 8px;color:var(--ink-2);font-size:.76rem;font-weight:500;min-height:58px;justify-content:center;
}
.tabs button svg{width:23px;height:23px}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs button[aria-current="page"]::before{
  content:"";position:absolute;top:0;left:50%;width:28px;height:3px;margin-left:-14px;
  border-radius:0 0 3px 3px;background:var(--accent);
}

/* Message */
#toast{
  position:absolute;left:14px;right:14px;bottom:calc(var(--dock-h,150px) + 12px);
  background:var(--raise);color:var(--ink);border:1px solid var(--line);
  box-shadow:0 12px 32px rgba(0,0,0,.5);
  border-radius:14px;padding:12px 16px;
  display:flex;align-items:center;gap:12px;justify-content:space-between;
  opacity:0;transform:translateY(6px);pointer-events:none;
  transition:opacity .18s ease,transform .18s ease;z-index:5;
  font-size:.95rem;
}
#toast.show{opacity:1;transform:none;pointer-events:auto}
#toast button{font-weight:700;color:var(--accent);padding:4px 6px}

.crumb{display:flex;align-items:center;gap:8px;min-height:30px;margin-bottom:4px}
.back{display:inline-flex;align-items:center;gap:2px;color:var(--accent);font-weight:600;font-size:.95rem;padding:4px 8px 4px 0}
.back svg{width:18px;height:18px}
.crumb-f{color:var(--ink-2);font-size:.9rem;overflow-wrap:anywhere}
.crumb-f::before{content:"/";margin-right:8px;opacity:.6}
.top h1{overflow-wrap:anywhere}
.actions{display:flex;gap:8px;margin:10px 0 2px}
.actions .btn{flex:1;min-height:46px;padding-left:10px;padding-right:10px;white-space:nowrap}
.fh{display:flex;align-items:center;gap:2px;margin:20px 0 8px}
.fh-main{flex:1;display:flex;align-items:center;gap:8px;min-width:0;text-align:left;padding:8px 6px;font-weight:600;font-size:1.04rem}
.fh-main .fn{overflow-wrap:anywhere}
.fh-main .chev{display:grid;place-items:center;color:var(--ink-2)}
.fh-main .chev svg{width:18px;height:18px}
.fh .rm{opacity:1}
.lrow{display:flex;align-items:center}
.lrow-main{flex:1;display:flex;align-items:center;gap:12px;text-align:left;padding:10px 4px 10px 16px;min-height:66px;min-width:0}
.ltxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.lname{font-weight:600;font-size:1.05rem;overflow-wrap:anywhere}
.lmeta{color:var(--ink-2);font-size:.85rem}
.lmeta.has{color:var(--accent)}
.lchev{display:grid;place-items:center;color:var(--ink-2)}
.lchev svg{width:18px;height:18px}
.nolist{padding:16px;color:var(--ink-2);font-size:.9rem}
#sheet{position:absolute;inset:0;z-index:20}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.sheet{
  position:absolute;left:0;right:0;bottom:0;
  background:var(--card);border-top:1px solid var(--line);border-radius:22px 22px 0 0;
  padding:22px 20px calc(env(safe-area-inset-bottom,0px) + 20px);
  display:flex;flex-direction:column;gap:14px;
  animation:rise .22s ease-out;
}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{margin:0;font-family:var(--serif);font-size:1.45rem;font-weight:600}
.lbl{display:flex;flex-direction:column;gap:6px;color:var(--ink-2);font-size:.88rem}
.sheet .row{display:flex;gap:8px}
.sheet .row .btn{flex:1;min-height:46px}
.sheet .btn.danger{min-height:46px}


:root{--c-courses:#5B93FF;--c-voyage:#3DD6C6;--c-autre:#B79CFF}
.sheet{max-height:92%;overflow-y:auto}
.btn.soft[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.sumcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-top:12px}
.sumtop{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sumlabel{color:var(--ink-2);font-size:.9rem}
.sumval{font-family:var(--serif);font-size:2rem;font-weight:600;letter-spacing:-0.01em}
.bar{display:flex;gap:3px;height:10px;margin:14px 0 12px;border-radius:5px;overflow:hidden}
.bar i{display:block;min-width:6px;border-radius:3px}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.legend li{display:flex;align-items:center;gap:10px;font-size:.92rem}
.legend li b{margin-left:auto;font-weight:600}
.dot{flex:none;width:9px;height:9px;border-radius:50%}
.cat-Courses{background:var(--c-courses)}
.cat-Voyage{background:var(--c-voyage)}
.cat-Autre{background:var(--c-autre)}
.cats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:18px 0 2px;padding-bottom:2px}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:500;font-size:.9rem;color:var(--ink-2)}
.cats button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.balrow{display:flex;align-items:center;gap:10px;padding:13px 16px}
.balrow .nm{flex:1;font-weight:600}
.balrow .st{font-size:.92rem;color:var(--ink-2)}
.balrow .st.pos{color:var(--accent);font-weight:600}
.balrow .st.neg{color:var(--danger);font-weight:600}
.setrow{display:flex;align-items:center;gap:10px;padding:12px 10px 12px 16px}
.setrow .tx{flex:1;min-width:0;font-size:.95rem;color:var(--ink-2)}
.setrow .tx b{color:var(--ink);font-weight:600}
.exday{margin:20px 6px 8px;font-size:.88rem;font-weight:600;color:var(--ink-2)}
.exmain{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 16px;min-height:64px}
.extxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.extitle{font-weight:600;font-size:1.02rem;overflow-wrap:anywhere}
.exmeta{color:var(--ink-2);font-size:.84rem}
.exright{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.examt{font-weight:700;font-variant-numeric:tabular-nums}
.extag{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;color:var(--ink-2)}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:11px 6px;border-radius:12px;background:var(--raise);border:1px solid var(--line);font-weight:600;font-size:.92rem;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chipset{display:flex;flex-wrap:wrap;gap:8px}
.chipset button{padding:9px 14px;border-radius:99px;background:var(--raise);border:1px solid var(--line);font-weight:500;color:var(--ink-2)}
.chipset button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
input[type="date"].field{min-height:46px;color-scheme:dark}

button.txtcol{background:none;text-align:left;align-items:flex-start;padding:10px 0;min-height:48px;justify-content:center}
.item .pr{font-variant-numeric:tabular-nums;font-size:.9rem;color:var(--ink-2);margin-right:2px}
.est{margin:6px 0 0;color:var(--accent);font-size:.9rem;font-weight:600}
.ghosts{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.ghosts .ghost{margin:0}
.ghost.accent{color:var(--accent);border-color:var(--accent)}
.banner{background:#0F1A33;border:1px solid rgba(91,147,255,.35);border-radius:var(--radius);padding:16px 18px;margin-top:14px}
.banner b{display:block;font-family:var(--serif);font-size:1.2rem;font-weight:600;margin-bottom:4px}
.banner p{margin:0 0 12px;color:var(--ink-2);font-size:.92rem}
.banner .row{display:flex;gap:8px;flex-wrap:wrap}
.sheet > .btn{min-height:46px}


.cats.first{margin-top:12px}
.shrow{display:flex;align-items:center;gap:8px}
.shrow > button:first-child{flex:1;text-align:left;padding:10px 14px;border-radius:12px;background:var(--raise);border:1px solid var(--line);font-weight:500;color:var(--ink-2)}
.shrow > button:first-child[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.stepper{display:inline-flex;align-items:center;gap:2px;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:2px}
.stepper button{width:38px;height:38px;border-radius:10px;font-size:1.2rem;font-weight:700;color:var(--ink)}
.stepper button:active{background:var(--line)}
.stepper .wv{min-width:22px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.shrow.off .stepper{opacity:.4}
.shares{display:flex;flex-direction:column;gap:8px}

.chart{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-top:12px}
.chart h3{margin:0;font-size:1rem;font-weight:700}
.chart .cs{margin:2px 0 16px;color:var(--ink-2);font-size:.85rem}
.chart .none{margin:0;color:var(--ink-2);font-size:.9rem}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.kpi b{display:block;font-family:var(--serif);font-size:1.75rem;font-weight:600;letter-spacing:-0.01em;line-height:1.15}
.kpi span{color:var(--ink-2);font-size:.85rem}
.hb{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:13px}
.hb li{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:baseline}
.hb .hl{font-weight:500;overflow-wrap:anywhere}
.hb .hv{font-variant-numeric:tabular-nums;font-weight:700;font-size:.9rem}

/* ---------- Outils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s).toLowerCase().replace(/œ/g,'oe').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’‘`]/g,"'").replace(/\s+/g,' ').trim();
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const plural = (n, one, many) => n >= 2 ? many : one;
const kwMatch = (w, kw) => w === kw || w === kw + 's' || w === kw + 'x';

function agoText(days){
  if (days < 1) return 'aujourd’hui';
  if (days < 2) return 'hier';
  const n = Math.round(days);
  return 'il y a ' + n + ' jours';
}
function everyText(avg){
  const n = Math.max(1, Math.round(avg));
  return n === 1 ? 'tous les jours' : 'tous les ' + n + ' jours';
}

/* ---------- État et stockage ---------- */
const CATS = ['Courses','Voyage','Autre'];
const eur = c => (c / 100).toLocaleString('fr-FR', { style:'currency', currency:'EUR' });
function todayStr(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function parseAmount(v){
  const n = parseFloat(String(v).replace(/\s/g,'').replace(',','.'));
  return Number.isFinite(n) && n > 0 && n < 1000000 ? Math.round(n * 100) : 0;
}
// Répartition en centimes, avec des parts (poids) : même résultat sur tous les appareils.
function splitCents(amt, ids, w){
  const list = [...ids].sort();
  if (!list.length) return [];
  const ws = list.map(id => Math.max(1, (w && parseInt(w[id], 10)) || 1));
  const W = ws.reduce((a,b) => a + b, 0);
  const base = ws.map(x => Math.floor(amt * x / W));
  let rem = amt - base.reduce((a,b) => a + b, 0);
  const order = ws.map((x,i) => [(amt * x) % W, i]).sort((a,b) => b[0] - a[0] || a[1] - b[1]);
  for (let k = 0; k < rem; k++) base[order[k][1]]++;
  return list.map((id,i) => [id, base[i]]);
}
function normW(w){
  const o = {};
  if (w && typeof w === 'object') for (const [k,v] of Object.entries(w)){ const n = parseInt(v,10); if (n >= 1 && n <= 9) o[k] = n; }
  return o;
}
function normExpense(e){
  return { id:String(e.id), title:String(e.title || '').slice(0,60), amt:Math.max(0, Math.round(Number(e.amt) || 0)),
    cat:CATS.includes(e.cat) ? e.cat : 'Autre', payerId:String(e.payerId || ''),
    shares:Array.isArray(e.shares) ? e.shares.map(String) : [], w:normW(e.w), type:e.type === 'transfer' ? 'transfer' : 'expense',
    toId:String(e.toId || ''), groupId:String(e.groupId || 'main'),
    date:/^\d{4}-\d{2}-\d{2}$/.test(e.date) ? e.date : todayStr(), ts:Number(e.ts) || 0, by:String(e.by || '').slice(0,20) };
}
const HCAP = 60;
function normHist(x){
  const strs = a => (Array.isArray(a) ? a : []).map(String).filter(t => /^\d+\|/.test(t)).sort((a,b) => parseInt(a,10) - parseInt(b,10)).slice(-HCAP);
  return { name:String(x.name), rayon:RAYONS.includes(x.rayon) ? x.rayon : 'Autre',
    dates:(Array.isArray(x.dates) ? x.dates : []).map(Number).filter(n => n > 0).sort((a,b) => a - b).slice(-HCAP),
    adds:strs(x.adds), px:strs(x.px), lastPrice:Math.max(0, Math.round(Number(x.lastPrice) || 0)), q:normQ(x.q) };
}
function normQ(q){
  if (!q || typeof q !== 'object') return null;
  const ns = /^[a-e]$/.test(q.ns) ? q.ns : '';
  const nova = [1,2,3,4].includes(parseInt(q.nova, 10)) ? parseInt(q.nova, 10) : 0;
  if (!ns && !nova) return null;
  return { ns, nova, src:['scan','manuel','match','frais'].includes(q.src) ? q.src : 'match', ref:String(q.ref || '').slice(0,60) };
}
function normTemplate(t){
  return { id:String(t.id), name:String(t.name || 'Modèle').slice(0,40), ts:Number(t.ts) || 0,
    items:(Array.isArray(t.items) ? t.items : []).filter(i => i && i.name).slice(0,200).map(i => ({ name:String(i.name).slice(0,60), qty:Math.max(1, parseInt(i.qty,10) || 1), rayon:RAYONS.includes(i.rayon) ? i.rayon : 'Autre' })) };
}
function normalizeState(s){
  const o = { items:[], history:{}, dismissed:{}, order:RAYONS.slice(), share:null, me:'', folders:[], lists:[], cur:'main', collapsed:{},
    people:[], expenses:[], meId:'', expCat:'all', groups:[], curGroup:'main', templates:[], barcodes:{}, statRange:'90', hintBackup:false };
  const defList = { id:'main', name:'Courses', folderId:null, ts:0 };
  const defGroup = { id:'main', name:'Général', ts:0 };
  if (s && typeof s === 'object'){
    if (Array.isArray(s.folders)) o.folders = s.folders.filter(f => f && f.id && f.name).map(f => ({ id:String(f.id), name:String(f.name).slice(0,40), ts:Number(f.ts) || 0 }));
    if (Array.isArray(s.lists)) o.lists = s.lists.filter(l => l && l.id && l.name).map(l => ({
      id:String(l.id), name:String(l.name).slice(0,40),
      folderId:(l.folderId && o.folders.some(f => f.id === l.folderId)) ? String(l.folderId) : null, ts:Number(l.ts) || 0 }));
    if (!o.lists.length) o.lists = [defList];
    o.cur = o.lists.some(l => l.id === s.cur) ? s.cur : o.lists[0].id;
    if (s.collapsed && typeof s.collapsed === 'object') o.collapsed = s.collapsed;
    if (Array.isArray(s.groups)) o.groups = s.groups.filter(g => g && g.id && g.name).map(g => ({ id:String(g.id), name:String(g.name).slice(0,40), ts:Number(g.ts) || 0 }));
    if (!o.groups.length) o.groups = [defGroup];
    o.curGroup = o.groups.some(g => g.id === s.curGroup) ? s.curGroup : o.groups[0].id;
    if (Array.isArray(s.people)) o.people = s.people.filter(p => p && p.id && p.name).map(p => ({ id:String(p.id), name:String(p.name).slice(0,30), ts:Number(p.ts) || 0 }));
    if (Array.isArray(s.expenses)) o.expenses = s.expenses.filter(e => e && e.id).map(normExpense).map(e => ({ ...e, groupId:o.groups.some(g => g.id === e.groupId) ? e.groupId : o.groups[0].id }));
    if (typeof s.meId === 'string' && o.people.some(p => p.id === s.meId)) o.meId = s.meId;
    if (s.expCat === 'all' || CATS.includes(s.expCat)) o.expCat = s.expCat;
    if (Array.isArray(s.templates)) o.templates = s.templates.filter(t => t && t.id).map(normTemplate);
    if (s.barcodes && typeof s.barcodes === 'object') for (const [c,n] of Object.entries(s.barcodes)) if (/^\d{6,14}$/.test(c) && typeof n === 'string') o.barcodes[c] = n.slice(0,60);
    if (['30','90','365','all'].includes(s.statRange)) o.statRange = s.statRange;
    o.hintBackup = !!s.hintBackup;
    if (Array.isArray(s.items)){
      o.items = s.items.filter(i => i && i.name && i.id).map(i => ({
        id:String(i.id), name:String(i.name), key:norm(i.name),
        listId:o.lists.some(l => l.id === i.listId) ? i.listId : o.lists[0].id,
        rayon:RAYONS.includes(i.rayon) ? i.rayon : 'Autre',
        qty:Math.max(1, parseInt(i.qty,10) || 1), price:Math.max(0, Math.round(Number(i.price) || 0)),
        done:!!i.done, doneTs:i.doneTs || null, ts:Number(i.ts) || 0, by:String(i.by || '').slice(0,20)
      }));
    }
    if (s.history && typeof s.history === 'object'){
      for (const [k,h] of Object.entries(s.history)) if (h && h.name) o.history[k] = normHist(h);
    }
    if (s.dismissed && typeof s.dismissed === 'object') o.dismissed = s.dismissed;
    if (s.share && typeof s.share.code === 'string' && /^[A-HJKMNP-Z2-9]{10}$/.test(s.share.code)) o.share = { code:s.share.code };
    if (typeof s.me === 'string') o.me = s.me.slice(0,20);
    if (Array.isArray(s.order)){
      const ord = [...new Set(s.order.filter(r => RAYONS.includes(r)))];
      RAYONS.forEach(r => { if (!ord.includes(r)) ord.push(r); });
      o.order = ord;
    }
  } else {
    o.lists = [defList]; o.groups = [defGroup];
  }
  return o;
}
function load(){
  try { const raw = localStorage.getItem(KEY); if (raw) return normalizeState(JSON.parse(raw)); } catch(e){}
  return normalizeState({});
}

/* ---------- Rayons ---------- */
function guessRayon(name){
  const k = norm(name);
  if (state.history[k]) return state.history[k].rayon;
  const words = k.split(/[\s'’\-]+/).filter(Boolean);
  for (const [rayon, list] of OVERRIDES)
    for (const w of words) if (list.some(kw => kwMatch(w, kw))) return rayon;
  for (const w of words)
    for (const rayon of RAYON_SCAN)
      if (KW[rayon].some(kw => kwMatch(w, norm(kw)))) return rayon;
  return 'Autre';
}

/* ---------- Prédiction ---------- */
function stats(h){
  const d = h.dates.slice().sort((a,b) => a - b);
  const gaps = [];
  for (let i = 1; i < d.length; i++){
    const g = (d[i] - d[i-1]) / DAY;
    if (g >= 1) gaps.push(g);
  }
  if (!gaps.length) return null;
  const recent = gaps.slice(-6);
  const avg = recent.reduce((a,b) => a + b, 0) / recent.length;
  const since = (Date.now() - d[d.length-1]) / DAY;
  return { avg, since, count:d.length, last:d[d.length-1] };
}
function suggestions(){
  const out = [];
  for (const [key,h] of Object.entries(state.history)){
    const s = stats(h);
    if (!s) continue;
    if (state.items.some(i => i.key === key && !i.done)) continue;
    if (state.dismissed[key] && Date.now() - state.dismissed[key] < 7 * DAY) continue;
    if (s.since < s.avg * 0.85) continue;
    if (s.since > s.avg * 4) continue;
    out.push({ key, h, s, score:s.since / s.avg });
  }
  return out.sort((a,b) => b.score - a.score).slice(0, 6);
}

/* ---------- Actions sur la liste ---------- */
function parseEntry(t){
  t = t.trim();
  let qty = 1, name = t, m;
  if ((m = t.match(/^(\d{1,2})\s*(?:x|×)?\s+(.+)$/i))){ qty = +m[1]; name = m[2]; }
  else if ((m = t.match(/^(.+?)\s*(?:x|×)\s*(\d{1,2})$/i))){ name = m[1]; qty = +m[2]; }
  return { name:name.trim(), qty:Math.max(1, qty) };
}
function newHist(name, rayon){ return { name, rayon, dates:[], adds:[], px:[], lastPrice:0, q:null }; }
function recordAdd(key, name, rayon){
  const h = state.history[key] || (state.history[key] = newHist(name, rayon));
  const e = Date.now() + '|' + (state.me || '');
  h.adds.push(e); h.adds = h.adds.slice(-HCAP);
  pushHistAdd(key, h, e);
}
function addItem(name, rayon, qty){
  name = cap((name || '').trim());
  if (!name) return false;
  const key = norm(name);
  qty = qty || 1;
  const ex = state.items.find(i => i.key === key && !i.done && i.listId === state.cur);
  if (ex){
    ex.qty += qty;
    lastAdded = ex.id;
    pushItem(ex);
    toast(ex.name + ' : quantité portée à ' + ex.qty);
  } else {
    const rz = rayon || guessRayon(name);
    const it = { id:uid(), name:(state.history[key] ? state.history[key].name : name), key, rayon:rz, qty,
      price:(state.history[key] && state.history[key].lastPrice) || 0, done:false, doneTs:null, ts:Date.now(), by:state.me || '', listId:state.cur };
    state.items.push(it);
    lastAdded = it.id;
    pushItem(it);
    recordAdd(key, it.name, rz);
  }
  save();
  return true;
}
function ensureHist(it){
  const h = state.history[it.key] || (state.history[it.key] = newHist(it.name, it.rayon));
  h.rayon = it.rayon;
  return h;
}
function toggle(id){
  const it = state.items.find(i => i.id === id);
  if (!it) return;
  it.done = !it.done;
  const h = ensureHist(it);
  if (it.done){
    it.doneTs = Date.now();
    h.dates.push(it.doneTs);
    h.dates.sort((a,b) => a - b);
    h.dates = h.dates.slice(-HCAP);
    let pxe = null;
    if (it.price){ pxe = it.doneTs + '|' + (it.price * it.qty); h.px.push(pxe); h.px = h.px.slice(-HCAP); h.lastPrice = it.price; }
    pushHistDate(it, it.doneTs, true, pxe);
  } else {
    const ts = it.doneTs;
    h.dates = h.dates.filter(t => t !== ts);
    const pxe = h.px.find(x => x.startsWith(ts + '|')) || null;
    if (pxe) h.px = h.px.filter(x => x !== pxe);
    it.doneTs = null;
    if (!h.dates.length && !h.adds.length){ delete state.history[it.key]; delHist(it.key); }
    else pushHistDate(it, ts, false, pxe);
  }
  pushItem(it);
  save(); render();
}
function removeItem(id){
  const idx = state.items.findIndex(i => i.id === id);
  if (idx < 0) return;
  const [it] = state.items.splice(idx, 1);
  delItem(it.id);
  save(); render();
  toast(it.name + ' retiré', 'Annuler', () => { state.items.splice(Math.min(idx, state.items.length), 0, it); pushItem(it); save(); render(); });
}

function donut(segs, center, sub, fmt){
  segs = segs.filter(x => x.value > 0);
  const total = segs.reduce((a,x) => a + x.value, 0);
  if (!total) return '';
  const R = 42, C = 2 * Math.PI * R;
  let off = 0;
  const arcs = segs.map(x => {
    const len = x.value / total * C, gap = segs.length > 1 ? 1.5 : 0, vis = Math.max(0, len - gap);
    const a = '<circle cx="60" cy="60" r="' + R + '" fill="none" stroke="' + x.color + '" stroke-width="16" stroke-dasharray="' + vis.toFixed(2) + ' ' + (C - vis).toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2) + '" transform="rotate(-90 60 60)"/>';
    off += len; return a;
  }).join('');
  return '<div class="donut"><svg viewBox="0 0 120 120" role="img" aria-label="' + esc(sub + ' : ' + center) + '">' + arcs +
    '<text class="dnum" x="60" y="64" text-anchor="middle">' + esc(center) + '</text><text class="dsub" x="60" y="78" text-anchor="middle">' + esc(sub) + '</text></svg>' +
    '<ul>' + segs.map(x => '<li><span class="dot" style="background:' + x.color + '"></span><span class="lb">' + esc(x.label) + '</span><b>' + esc(fmt ? fmt(x.value) : x.value) + '</b></li>').join('') + '</ul></div>';
}

    const mon = new Date(); mon.setHours(0,0,0,0); mon.setDate(mon.getDate() - ((mon.getDay() + 6) % 7));
    const weeks = [];

      weeks.push({ label:(i % 3 === 0 || i === 0) ? a.getDate() + '/' + (a.getMonth() + 1) : '', title:'Semaine du ' + a.getDate() + '/' + (a.getMonth() + 1), vals:[n] });

  if (priced.length){
    const m = new Map();

    h += '<h2>Vos prix</h2>' + chartCard('Les produits qui coûtent le plus', 'Total payé sur la période', hbars([...m.values()].sort((a,b) => b.value - a.value).slice(0, 8), v => eur(v), '#FF7B9C'));

    const byC = CATS.map(c => ({ label:c, value:exps.filter(e => e.cat === c).reduce((a,e) => a + e.amt, 0), color:CATCOL[c] }));

    const byP = new Map();
    exps.forEach(e => { const o = byP.get(e.payerId) || { label:personName(e.payerId), value:0 }; o.value += e.amt; byP.set(e.payerId, o); });
    if (byP.size) h += chartCard('Qui avance le plus d’argent ?', 'Total payé par personne', hbars([...byP.values()].sort((a,b) => b.value - a.value), v => eur(v), '#7BD88F'));
    const big = exps.slice().sort((a,b) => b.amt - a.amt).slice(0, 5);
    h += chartCard('Les plus grosses dépenses', '', '<ul class="topx">' + big.map(e => '<li><div class="tt"><b>' + esc(e.title || e.cat) + '</b><span>' + esc(dayLabel(e.date)) + ', ' + esc(e.cat) + '</span></div><span class="ta">' + esc(eur(e.amt)) + '</span></li>').join('') + '</ul>');
  }
  return h + (rows ? historyBlock() : '');
}
/* ---------- Qualité des achats ---------- */
const NS = ['a','b','c','d','e'];
const NS_COL = { a:'#038141', b:'#85BB2F', c:'#FECB02', d:'#EE8100', e:'#E63E11' };
const NS_INK = { a:'#FFFFFF', b:'#10200A', c:'#2B2400', d:'#2B1500', e:'#FFFFFF' };
const NOVA_COL = ['#7BD88F','#F2D45C','#FFB86B','#FF7B9C'];
const NOVA_LAB = ['Non transformés','Ingrédients culinaires','Transformés','Ultra-transformés'];
const SRC_LAB = { scan:'scanné', manuel:'corrigé', match:'estimé', frais:'estimé', avg:'estimé' };
const nsBadge = (g, cls) => g ? '<span class="ns ' + (cls || '') + '" style="background:' + NS_COL[g] + ';color:' + NS_INK[g] + '" aria-label="Nutri-Score ' + g.toUpperCase() + '">' + g.toUpperCase() + '</span>' : '';
const FRESH = 'Fruits et légumes';

function rayonAverages(){
  const acc = {};
  Object.values(state.history).forEach(h => {
    if (!h.q) return;
    const r = acc[h.rayon] || (acc[h.rayon] = { ns:[], nova:[] });
    if (h.q.ns) r.ns.push(NS.indexOf(h.q.ns));
    if (h.q.nova) r.nova.push(h.q.nova);
  });
  const out = {};
  Object.entries(acc).forEach(([r,v]) => {
    const m = a => a.reduce((x,y) => x + y, 0) / a.length;
    out[r] = { ns:v.ns.length ? NS[Math.round(m(v.ns))] : '', nova:v.nova.length ? Math.round(m(v.nova)) : 0 };
  });
  return out;
}
function effQuality(h, avgs){
  if (h.q) return h.q;
  if (h.rayon === FRESH) return { ns:'', nova:1, src:'frais' };
  const a = avgs[h.rayon];
  return a && (a.ns || a.nova) ? { ns:a.ns, nova:a.nova, src:'avg' } : null;
}
const needsEstimate = () => Object.entries(state.history).filter(([k,h]) => h.dates.length && !h.q && h.rayon !== FRESH);

const Q_DELAY = (typeof window.__caddieQDelay === 'number') ? window.__caddieQDelay : 6500;
let qBusy = false, qCancel = false;
const sleep = ms => new Promise(r => setTimeout(r, ms));
function median(arr){ const a = arr.slice().sort((x,y) => x - y); return a.length ? a[Math.floor((a.length - 1) / 2)] : 0; }
async function offMatch(name){
  const url = 'https://world.openfoodfacts.org/cgi/search.pl?search_terms=' + encodeURIComponent(name) +
    '&search_simple=1&action=process&json=1&page_size=12&sort_by=unique_scans_n&tagtype_0=countries&tag_contains_0=contains&tag_0=france&fields=code,product_name,nutriscore_grade,nova_group';
  const j = await fetchJson(url, 9000);
  const list = (j && Array.isArray(j.products)) ? j.products : [];
  const gs = list.map(x => NS.indexOf(x.nutriscore_grade)).filter(i => i >= 0);
  const nv = list.map(x => parseInt(x.nova_group, 10)).filter(n => n >= 1 && n <= 4);
  if (!gs.length && !nv.length) return null;
  const ref = (list.find(x => x.product_name) || {}).product_name || '';
  return { ns:gs.length ? NS[median(gs)] : '', nova:nv.length ? median(nv) : 0, src:'match', ref:String(ref).slice(0,60) };
}
async function estimateMissing(){
  if (qBusy) return;
  if (!navigator.onLine){ toast('Connectez-vous à internet pour estimer la qualité.'); return; }
  const todo = needsEstimate().sort((a,b) => b[1].dates.length - a[1].dates.length).slice(0, 10);
  if (!todo.length){ toast('Rien à estimer pour le moment.'); return; }
  qBusy = true; qCancel = false;
  let found = 0;
  for (let i = 0; i < todo.length && !qCancel; i++){
    const [k,h] = todo[i];
    toast('Estimation ' + (i + 1) + '/' + todo.length + ' : ' + h.name);
    const r = await offMatch(h.name);
    if (r && state.history[k]){ state.history[k].q = normQ(r); pushHistQ(k, state.history[k]); save(); found++; if (tab === 'stats') render(); }
    if (i < todo.length - 1 && !qCancel) await sleep(Q_DELAY);
  }
  qBusy = false;
  toast(qCancel ? 'Estimation arrêtée' : 'Estimation terminée : ' + found + ' ' + plural(found,'produit trouvé','produits trouvés') + ' sur ' + todo.length);
  if (tab === 'stats') render();
}
function editQuality(key){
  const h = state.history[key]; if (!h) return;
  const q = h.q || { ns:'', nova:0 };
  const el = $('#sheet');
  el.innerHTML = '<div class="sheet-bg" data-act="sheet-close"></div><form class="sheet" id="qform" autocomplete="off"><h3>' + esc(h.name) + '</h3>' +
    '<div class="lbl">Corrigez la qualité de ce produit : elle servira dans vos statistiques.</div>' +
    '<label class="lbl">Nutri-Score<select id="q-ns" class="field"><option value="">Inconnu</option>' + NS.map(g => '<option value="' + g + '"' + (q.ns === g ? ' selected' : '') + '>' + g.toUpperCase() + '</option>').join('') + '</select></label>' +
    '<label class="lbl">Niveau de transformation (NOVA)<select id="q-nova" class="field"><option value="0">Inconnu</option>' + NOVA_LAB.map((l,i) => '<option value="' + (i + 1) + '"' + (q.nova === i + 1 ? ' selected' : '') + '>' + (i + 1) + ' : ' + l + '</option>').join('') + '</select></label>' +
    '<div class="row"><button type="submit" class="btn">Enregistrer</button><button type="button" class="btn soft" data-act="sheet-close">Annuler</button></div>' +
    (h.q ? '<button type="button" class="btn soft" data-act="sheet-delete">Retirer l’évaluation (revenir à l’estimation)</button>' : '') + '</form>';
  el.hidden = false;
  sheetCfg = { onDelete:() => { closeSheet(); h.q = null; pushHistQ(key, h); save(); render(); toast('Évaluation retirée'); } };
  $('#qform').addEventListener('submit', ev => {
    ev.preventDefault();
    const ns = $('#q-ns').value, nova = parseInt($('#q-nova').value, 10) || 0;
    closeSheet();
    if (!ns && !nova){ h.q = null; pushHistQ(key, h); save(); render(); return; }
    setQuality(key, { ns, nova, src:'manuel', ref:'' }); render(); toast('Qualité enregistrée');
  });
}
function qualityHtml(buys){
  if (!buys.length) return '';
  const avgs = rayonAverages();
  const qm = {};
  Object.entries(state.history).forEach(([k,h]) => { qm[k] = effQuality(h, avgs); });
  const nsC = { a:0, b:0, c:0, d:0, e:0 }, novaC = [0,0,0,0], srcC = { scan:0, manuel:0, match:0, frais:0, avg:0 };
  let evaluated = 0;
  buys.forEach(e => {
    const q = qm[e.key];
    if (!q || (!q.ns && !q.nova)) return;
    evaluated++; srcC[q.src || 'scan']++;
    if (q.ns) nsC[q.ns]++;
    if (q.nova) novaC[q.nova - 1]++;
  });
  let h = '<h2>Qualité de vos achats</h2>';
  if (!evaluated){
    h += chartCard('Nutri-Score et transformation', '', '<p class="none">Scannez des produits, ou lancez une estimation, pour voir la qualité de ce que vous achetez.</p>' + estBox(buys.length, evaluated));
    return h;
  }
  const nsTot = NS.reduce((a,g) => a + nsC[g], 0);
  const avgG = nsTot ? NS[Math.round(NS.reduce((a,g,i) => a + i * nsC[g], 0) / nsTot)] : '';
  const exact = srcC.scan + srcC.manuel, est = evaluated - exact;
  const pct = n => Math.round(n / buys.length * 100);
  h += '<section class="chart"><div class="qtop">' + (avgG ? nsBadge(avgG, 'big') : '') + '<p><b>' + (avgG ? 'Votre panier : Nutri-Score ' + avgG.toUpperCase() : 'Qualité de votre panier') + '</b> ' +
    pct(evaluated) + ' % de vos achats sont évalués : ' + pct(exact) + ' % de façon sûre (scannés ou corrigés) et ' + pct(est) + ' % par estimation.</p></div>' + estBox(buys.length, evaluated) + '</section>';
  if (nsTot){
    h += chartCard('Répartition par Nutri-Score', 'Nombre d’achats par note, de A (meilleur) à E',
      columns(NS.map(g => ({ label:g.toUpperCase(), title:'Nutri-Score ' + g.toUpperCase(), vals:[nsC[g]], color:NS_COL[g] })), ['#5B93FF'], v => String(v), 'Achats par Nutri-Score'));
  }
  const novaTot = novaC.reduce((a,b) => a + b, 0);
  if (novaTot){
    h += chartCard('Niveau de transformation (NOVA)', '4 correspond aux produits ultra-transformés',
      donut(NOVA_LAB.map((l,i) => ({ label:(i + 1) + ' ' + l, value:novaC[i], color:NOVA_COL[i] })), Math.round(novaC[3] / novaTot * 100) + ' %', 'NOVA 4'));
    const months = [];
    for (let i = 5; i >= 0; i--){ const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i); months.push(d); }
    const evs = buyEvents();
    const cols = months.map(d => {
      let t = 0, u = 0;
      evs.forEach(e => { const dd = new Date(e.ts); if (dd.getFullYear() === d.getFullYear() && dd.getMonth() === d.getMonth()){ const q = qm[e.key]; if (q && q.nova){ t++; if (q.nova === 4) u++; } } });
      return { label:d.toLocaleDateString('fr-FR', { month:'short' }).replace('.', ''), title:cap(d.toLocaleDateString('fr-FR', { month:'long' })), vals:[t ? Math.round(u / t * 100) : 0], color:'#FF7B9C' };
    });
    if (cols.filter(c => c.vals[0] > 0).length >= 2) h += chartCard('Part d’ultra-transformés par mois', 'Parmi les achats évalués', columns(cols, ['#FF7B9C'], v => v + ' %', 'Part des produits ultra-transformés par mois'));
  }
  const counts = {};
  buys.forEach(e => { counts[e.key] = (counts[e.key] || 0) + 1; });
  const rows = Object.keys(counts).map(k => ({ k, n:counts[k], q:qm[k], h:state.history[k] })).filter(x => x.q && x.h);
  const bad = rows.filter(x => x.q.ns === 'd' || x.q.ns === 'e' || x.q.nova === 4).sort((a,b) => b.n - a.n).slice(0, 6);
  const good = rows.filter(x => (x.q.ns === 'a' || x.q.ns === 'b') && (!x.q.nova || x.q.nova <= 2)).sort((a,b) => b.n - a.n).slice(0, 5);
  const row = x => '<li><button type="button" class="qrow" data-act="q-edit" data-key="' + esc(x.k) + '" aria-label="Corriger la qualité de ' + esc(x.h.name) + '">' + (nsBadge(x.q.ns) || '<span class="ns" style="background:var(--raise);color:var(--ink-2)">?</span>') +
    '<span class="extxt"><span class="extitle">' + esc(x.h.name) + '</span><span class="exmeta">Acheté ' + x.n + ' fois, ' + (x.q.nova ? 'NOVA ' + x.q.nova + ', ' : '') + SRC_LAB[x.q.src || 'scan'] + (x.q.ref && x.q.src === 'match' ? ' (proche de « ' + esc(x.q.ref) + ' »)' : '') + '</span></span></button></li>';
  if (bad.length) h += chartCard('Produits à surveiller', 'Nutri-Score D ou E, ou ultra-transformés. Touchez un produit pour corriger.', '<ul class="qlist">' + bad.map(row).join('') + '</ul>');
  if (good.length) h += chartCard('Vos bons réflexes', 'Nutri-Score A ou B, peu transformés', '<ul class="qlist">' + good.map(row).join('') + '</ul>');
  return h;
}
function estBox(total, evaluated){
  const n = needsEstimate().length;
  if (qBusy) return '<div class="estbox"><p>Estimation en cours…</p><button type="button" class="btn soft" data-act="q-stop">Arrêter</button></div>';
  if (!n) return '<div class="estbox"><p>Les produits scannés donnent une qualité exacte. Les autres sont estimés par la moyenne de leur rayon.</p></div>';

}

async function fetchJson(url, ms){
  const ctl = new AbortController();
  const to = setTimeout(() => ctl.abort(), ms || 8000);
  try {
    const r = await fetch(url, { signal:ctl.signal });
    if (!r.ok) return null;

  } catch(e){ return null; }
  finally { clearTimeout(to); }
}
async function lookupBarcode(code){
  if (state.barcodes[code]) return { name:state.barcodes[code], ns:'', nova:0, local:true };
  const j = await fetchJson('https://world.openfoodfacts.org/api/v2/product/' + code + '.json?fields=product_name,product_name_fr,generic_name_fr,nutriscore_grade,nova_group');
  const pr = j && j.status === 1 && j.product;
  const n = pr && (pr.product_name_fr || pr.product_name || pr.generic_name_fr);
  if (!n) return null;
  return { name:String(n).trim().slice(0, 50), ns:/^[a-e]$/.test(pr.nutriscore_grade) ? pr.nutriscore_grade : '', nova:parseInt(pr.nova_group, 10) || 0 };
}

/* ---------- Partage et synchronisation (Firebase) ---------- */
const CFG = (window.CADDIE_FIREBASE && window.CADDIE_FIREBASE.apiKey && window.CADDIE_FIREBASE.projectId) ? window.CADDIE_FIREBASE : null;
const FB_VERSION = '10.14.1';
const CODE_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
let fb = null, fbPromise = null, unsubs = [];
const net = { pending:false, cache:false, error:null, connecting:false };

const fmtCode = c => c.slice(0,5) + '-' + c.slice(5);
const cleanCode = x => String(x || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const validCode = c => /^[A-HJKMNP-Z2-9]{10}$/.test(c);
function genCode(){
  const a = new Uint8Array(10);
  crypto.getRandomValues(a);
  return [...a].map(n => CODE_CHARS[n % CODE_CHARS.length]).join('');
}
const hid = k => encodeURIComponent(k).replace(/%/g, '~').replace(/\./g, '~2E');

async function fbLoad(){
  if (fb) return fb;
  if (!fbPromise){
    fbPromise = (async () => {
      const mock = window.__caddieFirebaseMock;
      const base = 'https://www.gstatic.com/firebasejs/' + FB_VERSION + '/';
      const [app, auth, fs] = mock ? [mock, mock, mock] : await Promise.all([
        import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')
      ]);
      const a = app.initializeApp(CFG);
      let db;
      try { db = fs.initializeFirestore(a, { localCache:fs.persistentLocalCache({ tabManager:fs.persistentMultipleTabManager() }) }); }
      catch(e){ db = fs.getFirestore(a); }
      const au = auth.getAuth(a);
      await new Promise((resolve, reject) => {
        let un = null, done = false;
        const finish = () => { done = true; if (un) un(); resolve(); };
        un = auth.onAuthStateChanged(au, u => { if (u) finish(); });
        if (done) un();
        else if (!au.currentUser) auth.signInAnonymously(au).catch(reject);
      });
      fb = { fs, db };
      return fb;
    })().catch(e => { fbPromise = null; throw e; });
  }
  return fbPromise;
}

async function pushAll(){
  const ops = [];
  state.folders.forEach(f => ops.push([dref('folders', f.id), { name:f.name, ts:f.ts || Date.now() }]));
  state.lists.forEach(l => ops.push([dref('lists', l.id), { name:l.name, folderId:l.folderId || '', ts:l.ts || 0 }]));
  state.groups.forEach(g => ops.push([dref('groups', g.id), { name:g.name, ts:g.ts || 0 }]));
  state.people.forEach(p => ops.push([dref('people', p.id), { name:p.name, ts:p.ts || Date.now() }]));
  state.expenses.forEach(e => ops.push([dref('expenses', e.id), expData(e)]));
  state.items.forEach(it => ops.push([dref('items', it.id), itemData(it)]));
  state.templates.forEach(t => ops.push([dref('templates', t.id), { name:t.name, items:t.items, ts:t.ts || Date.now() }]));
  Object.entries(state.history).forEach(([k,h]) => ops.push([dref('history', hid(k)), histData(k, h)]));
  for (let i = 0; i < ops.length; i += 400){
    const b = fb.fs.writeBatch(fb.db);
    ops.slice(i, i + 400).forEach(([r,d]) => b.set(r, d));
    await b.commit();
  }
}

function shareStatus(){
  if (!state.share) return null;
  if (!CFG) return { t:'Partage non configuré', k:'bad' };
  if (net.error) return { t:'Erreur de partage', k:'bad' };
  if (net.connecting || !fb) return { t:'Connexion…', k:'wait' };
  if (!navigator.onLine) return { t:'Hors ligne', k:'wait' };
  if (net.pending) return { t:'Synchronisation…', k:'wait' };
  return { t:'Partagée', k:'ok' };
}
function stopSync(){ unsubs.forEach(u => { try { u(); } catch(e){} }); unsubs = []; }
function afterRemote(snap){
  net.pending = snap.metadata.hasPendingWrites;
  net.cache = snap.metadata.fromCache;
  net.error = null;
  save();
  if (tab === 'settings') renderHeader(); else render();
}
async function startSync(){
  if (!CFG || !state.share) return;
  net.connecting = true; net.error = null; renderHeader();
  try { await fbLoad(); }
  catch(e){ net.connecting = false; net.error = (e && e.code) || 'connexion'; renderHeader(); return; }
  net.connecting = false;
  stopSync();
  const code = state.share.code;
  unsubs.push(fb.fs.onSnapshot(colref('items'), snap => {
    if (!state.share || state.share.code !== code) return;
    state.items = snap.docs.map(d => {
      const x = d.data();
      return { id:d.id, name:String(x.name || ''), key:norm(x.name || ''), listId:String(x.listId || 'main'), rayon:RAYONS.includes(x.rayon) ? x.rayon : 'Autre',
        qty:Math.max(1, parseInt(x.qty, 10) || 1), price:Math.max(0, Math.round(Number(x.price) || 0)), done:!!x.done, doneTs:x.doneTs || null, ts:Number(x.ts) || 0, by:String(x.by || '') };
    }).filter(i => i.name).sort((a,b) => a.ts - b.ts);
    afterRemote(snap);
  }, onErr));
  unsubs.push(fb.fs.onSnapshot(colref('lists'), snap => {
    if (!state.share || state.share.code !== code) return;
    const arr = snap.docs.map(d => { const x = d.data(); return { id:d.id, name:String(x.name || 'Liste').slice(0,40), folderId:x.folderId || null, ts:Number(x.ts) || 0 }; })
      .sort((a,b) => a.ts - b.ts);
    if (arr.length){ state.lists = arr; }
    else if (!snap.metadata.fromCache){ state.lists.forEach(pushList); }
    if (!state.lists.some(l => l.id === state.cur)){ state.cur = state.lists[0].id; if (tab === 'list') tab = 'lists'; }
    afterRemote(snap);
  }, onErr));
  unsubs.push(fb.fs.onSnapshot(colref('groups'), snap => {
    if (!state.share || state.share.code !== code) return;
    const arr = snap.docs.map(d => { const x = d.data(); return { id:d.id, name:String(x.name || 'Groupe').slice(0,40), ts:Number(x.ts) || 0 }; })
      .sort((a,b) => a.ts - b.ts);
    if (arr.length){ state.groups = arr; }
    else if (!snap.metadata.fromCache){ state.groups.forEach(pushGroup); }
    if (!state.groups.some(g => g.id === state.curGroup)) state.curGroup = state.groups[0].id;
    afterRemote(snap);
  }, onErr));
  unsubs.push(fb.fs.onSnapshot(colref('people'), snap => {
    if (!state.share || state.share.code !== code) return;
    const arr = snap.docs.map(d => { const x = d.data(); return { id:d.id, name:String(x.name || '').slice(0,30), ts:Number(x.ts) || 0 }; })
      .filter(p => p.name).sort((a,b) => a.ts - b.ts);
    if (arr.length || !snap.metadata.fromCache) state.people = arr;
    if (state.meId && !state.people.some(p => p.id === state.meId)) state.meId = '';
    afterRemote(snap);
  }, onErr));
  unsubs.push(fb.fs.onSnapshot(colref('expenses'), snap => {
    if (!state.share || state.share.code !== code) return;
    const arr = snap.docs.map(d => normExpense({ id:d.id, ...d.data() })).sort((a,b) => a.ts - b.ts);
    if (arr.length || !snap.metadata.fromCache) state.expenses = arr;
    afterRemote(snap);
  }, onErr));
  unsubs.push(fb.fs.onSnapshot(colref('folders'), snap => {
    if (!state.share || state.share.code !== code) return;
    const arr = snap.docs.map(d => { const x = d.data(); return { id:d.id, name:String(x.name || 'Dossier').slice(0,40), ts:Number(x.ts) || 0 }; })
      .sort((a,b) => a.ts - b.ts);
    if (arr.length || !snap.metadata.fromCache) state.folders = arr;
    afterRemote(snap);
  }, onErr));
  unsubs.push(fb.fs.onSnapshot(colref('history'), snap => {
    if (!state.share || state.share.code !== code) return;
    const hist = {};
    snap.docs.forEach(d => { const x = d.data(); if (x.name) hist[x.key || d.id] = normHist(x); });
    state.history = hist;
    afterRemote(snap);
  }, onErr));
  unsubs.push(fb.fs.onSnapshot(colref('templates'), snap => {
    if (!state.share || state.share.code !== code) return;
    const arr = snap.docs.map(d => normTemplate({ id:d.id, ...d.data() })).sort((a,b) => a.ts - b.ts);
    if (arr.length || !snap.metadata.fromCache) state.templates = arr;
    afterRemote(snap);
  }, onErr));
  renderHeader();
}

  }

async function joinHousehold(raw){
  const code = cleanCode(raw);
  if (!validCode(code)){ toast('Ce code n’est pas valide : il compte 10 caractères.'); return; }
  if (state.share && state.share.code === code){ toast('Vous êtes déjà dans ce partage.'); return; }
  if (!navigator.onLine){ toast('Connectez-vous à internet pour rejoindre un partage.'); return; }
  toast('Connexion au partage…');
  try {
    await fbLoad();
    const snap = await fb.fs.getDoc(fb.fs.doc(fb.db, 'households', code));
    if (!snap.exists()){ toast('Code introuvable. Vérifiez-le auprès de la personne qui partage.'); return; }
  } catch(e){
    toast('Connexion impossible (' + ((e && e.code) || 'erreur') + '). Vérifiez la configuration Firebase.');
    return;
  }
  if (state.items.length && !confirm('La liste de cet appareil sera remplacée par la liste partagée. Continuer ?')) return;
  stopSync();
  state.share = { code };
  state.items = []; state.history = {};
  state.folders = []; state.lists = [{ id:'main', name:'Courses', folderId:null, ts:0 }]; state.cur = 'main'; state.collapsed = {};
  state.people = []; state.expenses = []; state.meId = ''; state.templates = [];
  state.groups = [{ id:'main', name:'Général', ts:0 }]; state.curGroup = 'main';
  save();
  await startSync();
  render();
  toast('Vous avez rejoint la liste partagée');
}
function leaveHousehold(){

/* ---------- Dépenses ---------- */
const personName = id => { const p = state.people.find(x => x.id === id); return p ? p.name : 'Ancien membre'; };
const groupExpenses = () => state.expenses.filter(e => e.groupId === state.curGroup);
const curGroupObj = () => state.groups.find(g => g.id === state.curGroup) || state.groups[0];
function balances(list){
  const b = {};
  state.people.forEach(p => b[p.id] = 0);
  (list || state.expenses).forEach(e => {
    if (!(e.payerId in b)) b[e.payerId] = 0;
    if (e.type === 'transfer'){
      b[e.payerId] += e.amt;
      if (!(e.toId in b)) b[e.toId] = 0;
      b[e.toId] -= e.amt;
    } else if (e.shares.length){
      b[e.payerId] += e.amt;
      splitCents(e.amt, e.shares, e.w).forEach(([id,v]) => { if (!(id in b)) b[id] = 0; b[id] -= v; });
    }
  });
  return b;
}
function settlements(b){
  const cr = [], de = [];
  state.people.forEach(p => { const v = b[p.id] || 0; if (v > 0) cr.push([p.id, v]); else if (v < 0) de.push([p.id, -v]); });
  cr.sort((a,c) => c[1] - a[1]); de.sort((a,c) => c[1] - a[1]);
  const out = [];
  let i = 0, j = 0;
  while (i < de.length && j < cr.length){
    const m = Math.min(de[i][1], cr[j][1]);
    if (m > 0) out.push({ from:de[i][0], to:cr[j][0], amt:m });
    de[i][1] -= m; cr[j][1] -= m;
    if (de[i][1] === 0) i++;
    if (cr[j][1] === 0) j++;
  }
  return out;
}
function dayLabel(str){

  if (str === t) return 'Aujourd’hui';
  if (str === ys) return 'Hier';
  return cap(new Date(str + 'T12:00:00').toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' }));
}

  }
  const spent = gx.filter(e => e.type === 'expense');
  const total = spent.reduce((a,e) => a + e.amt, 0);
  const byCat = {}; CATS.forEach(c => byCat[c] = 0);
  spent.forEach(e => byCat[e.cat] += e.amt);
  if (total > 0){
    h += '<div class="sumcard"><div class="sumtop"><span class="sumlabel">Total dépensé</span><span class="sumval">' + esc(eur(total)) + '</span></div>' +

      '<ul class="legend">' + CATS.map(c => '<li><span class="dot cat-' + c + '"></span>' + c + '<b>' + esc(eur(byCat[c])) + '</b></li>').join('') + '</ul></div>';
  }
  const b = balances(gx);
  h += '<h2>Soldes</h2><ul class="list">' + state.people.map(p => {
    const v = b[p.id] || 0;
    const st = v > 0 ? '<span class="st pos">À recevoir ' + esc(eur(v)) + '</span>' : v < 0 ? '<span class="st neg">Doit ' + esc(eur(-v)) + '</span>' : '<span class="st">À jour</span>';
    return '<li class="balrow"><span class="nm">' + esc(p.name) + '</span> ' + st + '</li>';
  }).join('') + '</ul>';
  const sets = settlements(b);
  if (sets.length){
    h += '<h2>Pour équilibrer</h2><ul class="list">' + sets.map(x =>
      '<li class="setrow"><span class="tx"><b>' + esc(personName(x.from)) + '</b> doit <b>' + esc(eur(x.amt)) + '</b> à <b>' + esc(personName(x.to)) + '</b></span>' +
      '<button type="button" class="btn soft" data-act="settle" data-from="' + esc(x.from) + '" data-to="' + esc(x.to) + '" data-amt="' + x.amt + '">Remboursé</button></li>').join('') + '</ul>';
  }
  h += '<h2>Dépenses</h2><div class="cats" role="group" aria-label="Filtrer par catégorie">' +
    [['all','Toutes']].concat(CATS.map(c => [c,c])).map(([v,l]) => '<button type="button" data-act="exp-filter" data-cat="' + v + '" aria-pressed="' + (state.expCat === v) + '">' + l + '</button>').join('') + '</div>';
  const shown = gx.filter(e => state.expCat === 'all' || (e.type === 'expense' && e.cat === state.expCat))
    .sort((a,c) => c.date.localeCompare(a.date) || c.ts - a.ts);
  if (!shown.length) return h + '<div class="empty" style="margin-top:12px">Aucune dépense dans cette catégorie.</div>';
  let last = '';
  shown.forEach(e => {
    if (e.date !== last){
      if (last) h += '</ul>';
      h += '<div class="exday">' + esc(dayLabel(e.date)) + '</div><ul class="list">';
      last = e.date;
    }
    const isT = e.type === 'transfer';
    const uneven = !isT && Object.keys(e.w || {}).length > 0;
    const meta = isT ? personName(e.payerId) + ' a remboursé ' + personName(e.toId) : 'Payé par ' + personName(e.payerId) + ', ' + e.shares.length + ' ' + plural(e.shares.length,'personne','personnes') + (uneven ? ', parts inégales' : '');
    h += '<li><button type="button" class="exmain" data-act="edit-expense" data-id="' + esc(e.id) + '"><span class="extxt"><span class="extitle">' + esc(isT ? 'Remboursement' : (e.title || e.cat)) + '</span><span class="exmeta">' + esc(meta) + '</span></span>' +
      '<span class="exright"><span class="examt">' + esc(eur(e.amt)) + '</span>' + (isT ? '<span class="extag">Remboursement</span>' : '<span class="extag"><span class="dot cat-' + e.cat + '"></span>' + e.cat + '</span>') + '</span></button></li>';
  });
  return h + '</ul><div class="ghosts"><button type="button" class="ghost" data-act="edit-group">Modifier ce groupe</button><button type="button" class="ghost" data-act="export-csv">Exporter en tableur</button></div>';
}

function noteExpense(total){ openExpense({ cat:'Courses', title:curList().name, amount:total || 0 }); }
function newExpenseObj(f){ return { id:uid(), ts:Date.now(), by:state.me || '', groupId:state.curGroup, w:{}, ...f }; }
function saveExpense(e, isNew){
  if (isNew) state.expenses.push(e);
  pushExpense(e); save(); render();
}
function openExpense(opts){
  opts = opts || {};
  if (!state.people.length){ toast('Ajoutez d’abord les personnes qui partagent les dépenses.'); openPeople(); return; }
  const ex = opts.expense || null;
  const cat = ex ? ex.cat : (opts.cat || 'Courses');
  const payer = ex ? ex.payerId : (state.people.some(p => p.id === state.meId) ? state.meId : state.people[0].id);
  const shares = new Set(ex ? ex.shares : state.people.map(p => p.id));
  const el = $('#sheet');
  el.innerHTML = '<div class="sheet-bg" data-act="sheet-close"></div><form class="sheet" id="exform" autocomplete="off"><h3>' + (ex ? 'Modifier la dépense' : 'Nouvelle dépense') + '</h3>' +
    '<label class="lbl">Titre<input id="ex-title" class="field" type="text" maxlength="60" value="' + esc(ex ? ex.title : (opts.title || '')) + '" placeholder="Par exemple : Courses du samedi"></label>' +
    '<label class="lbl">Montant en euros<input id="ex-amount" class="field" type="text" inputmode="decimal" value="' + (ex ? (ex.amt / 100).toFixed(2).replace('.', ',') : (opts.amount ? (opts.amount / 100).toFixed(2).replace('.', ',') : '')) + '" placeholder="0,00"></label>' +
    '<div class="lbl">Catégorie<div class="seg" role="group">' + CATS.map(c => '<button type="button" data-act="ex-cat" data-cat="' + c + '" aria-pressed="' + (c === cat) + '">' + c + '</button>').join('') + '</div></div>' +
    '<label class="lbl">Payé par<select id="ex-payer" class="field">' + state.people.map(p => '<option value="' + esc(p.id) + '"' + (p.id === payer ? ' selected' : '') + '>' + esc(p.name) + '</option>').join('') + '</select></label>' +
    '<label class="lbl">Date<input id="ex-date" class="field" type="date" value="' + esc(ex ? ex.date : todayStr()) + '"></label>' +
    '<div class="lbl">Réparti entre (parts)<div class="shares">' + state.people.map(p => {
      const wv = (ex && ex.w && ex.w[p.id]) || 1;
      return '<div class="shrow' + (shares.has(p.id) ? '' : ' off') + '" data-id="' + esc(p.id) + '"><button type="button" data-act="ex-share" data-id="' + esc(p.id) + '" aria-pressed="' + shares.has(p.id) + '">' + esc(p.name) + '</button>' +
        '<span class="stepper"><button type="button" data-act="ex-w" data-id="' + esc(p.id) + '" data-d="-1" aria-label="Moins de parts pour ' + esc(p.name) + '">−</button><span class="wv" data-id="' + esc(p.id) + '" aria-live="polite">' + wv + '</span><button type="button" data-act="ex-w" data-id="' + esc(p.id) + '" data-d="1" aria-label="Plus de parts pour ' + esc(p.name) + '">+</button></span></div>';
    }).join('') + '</div></div>' +
    '<div class="row"><button type="submit" class="btn">Enregistrer</button><button type="button" class="btn soft" data-act="sheet-close">Annuler</button></div>' +
    (ex ? '<button type="button" class="btn danger" data-act="sheet-delete">Supprimer la dépense</button>' : '') + '</form>';
  el.hidden = false;
  sheetCfg = ex ? { onDelete:() => { if (confirm('Supprimer cette dépense ?')){ closeSheet(); state.expenses = state.expenses.filter(x => x.id !== ex.id); delExpense(ex.id); save(); render(); toast('Dépense supprimée'); } } } : {};
  $('#exform').addEventListener('submit', ev => {
    ev.preventDefault();
    const amt = parseAmount($('#ex-amount').value);
    const sel = [...document.querySelectorAll('#exform [data-act="ex-share"][aria-pressed="true"]')].map(b => b.dataset.id);
    const c = (document.querySelector('#exform [data-act="ex-cat"][aria-pressed="true"]') || {}).dataset;
    if (!amt){ toast('Saisissez un montant supérieur à zéro.'); $('#ex-amount').focus(); return; }
    if (!sel.length){ toast('Choisissez au moins une personne.'); return; }
    const w = {};
    sel.forEach(id => { const n = parseInt((document.querySelector('#exform .wv[data-id="' + id + '"]') || {}).textContent, 10) || 1; if (n > 1) w[id] = n; });
    const f = { title:cap($('#ex-title').value.trim()), amt, cat:c ? c.cat : 'Autre', payerId:$('#ex-payer').value, shares:sel, w, type:'expense', toId:'', date:$('#ex-date').value || todayStr() };
    closeSheet();
    if (ex){ Object.assign(ex, f); saveExpense(ex, false); }
    else saveExpense(newExpenseObj(f), true);
    toast(ex ? 'Dépense modifiée' : 'Dépense ajoutée');
  });
  setTimeout(() => { const n = $('#ex-title'); if (n && !ex) n.focus(); }, 60);
}
function newGroup(){
  openSheet({ title:'Nouveau groupe de dépenses', placeholder:'Par exemple : Voyage en Italie', saveLabel:'Créer',
    onSave:name => { const g = { id:uid(), name, ts:Date.now() }; state.groups.push(g); pushGroup(g); state.curGroup = g.id; state.expCat = 'all'; save(); render(); toast('Groupe « ' + name + ' » créé'); } });
}
function editGroup(){
  const g = curGroupObj();
  openSheet({ title:'Modifier le groupe', name:g.name,
    onSave:name => { g.name = name; pushGroup(g); save(); render(); },
    onDelete:() => deleteGroup(g.id), deleteLabel:'Supprimer le groupe' });
}
function deleteGroup(id){
  const g = state.groups.find(x => x.id === id); if (!g) return;
  if (state.groups.length <= 1){ closeSheet(); toast('Gardez au moins un groupe.'); return; }
  const ex = state.expenses.filter(e => e.groupId === id);
  if (!confirm('Supprimer le groupe « ' + g.name + ' »' + (ex.length ? ' et ses ' + ex.length + ' ' + plural(ex.length,'dépense','dépenses') : '') + ' ?')) return;
  closeSheet();
  ex.forEach(e => delExpense(e.id));
  state.expenses = state.expenses.filter(e => e.groupId !== id);
  state.groups = state.groups.filter(x => x.id !== id);
  delGroup(id);
  state.curGroup = state.groups[0].id;
  save(); render(); toast('Groupe supprimé');
}

/* ---------- Exports tableur ---------- */
const csvCell = v => { const t = String(v == null ? '' : v); return /[;"\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
const csvMoney = c => (c / 100).toFixed(2).replace('.', ',');
function downloadText(name, text){
  try {
    const blob = new Blob(['\ufeff' + text], { type:'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  } catch(e){ toast('L’export a échoué sur cet appareil.'); }
}
function exportExpensesCsv(){
  const gname = id => (state.groups.find(g => g.id === id) || { name:'' }).name;
  const rows = [['Date','Groupe','Type','Titre','Catégorie','Montant (€)','Payé par','Réparti entre','Remboursé à']];
  state.expenses.slice().sort((a,b) => a.date.localeCompare(b.date) || a.ts - b.ts).forEach(e => {
    const isT = e.type === 'transfer';
    rows.push([e.date, gname(e.groupId), isT ? 'Remboursement' : 'Dépense', isT ? 'Remboursement' : e.title, isT ? '' : e.cat, csvMoney(e.amt), personName(e.payerId),
      isT ? '' : e.shares.map(id => personName(id) + ((e.w && e.w[id] > 1) ? ' (' + e.w[id] + ' parts)' : '')).join(', '), isT ? personName(e.toId) : '']);
  });
  downloadText('caddie-depenses.csv', rows.map(r => r.map(csvCell).join(';')).join('\r\n'));
  toast('Fichier des dépenses exporté');
}
function exportPurchasesCsv(){
  const rows = [['Date','Produit','Rayon','Total payé (€)']];
  const all = [];
  Object.values(state.history).forEach(h => h.dates.forEach(ts => {
    const px = h.px.find(x => x.startsWith(ts + '|'));
    all.push([ts, h.name, h.rayon, px ? csvMoney(parseInt(px.split('|')[1], 10)) : '']);
  }));
  all.sort((a,b) => a[0] - b[0]).forEach(r => { const d = new Date(r[0]); rows.push([d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'), r[1], r[2], r[3]]); });
  downloadText('caddie-achats.csv', rows.map(r => r.map(csvCell).join(';')).join('\r\n'));
  toast('Fichier des achats exporté');
}

function openPeople(){
  const el = $('#sheet');
  el.innerHTML = '<div class="sheet-bg" data-act="sheet-close"></div><form class="sheet" id="peopleform" autocomplete="off"><h3>Personnes</h3>' +
    '<div class="lbl">Qui partage les dépenses ? Touchez « Moi » à côté de votre prénom.</div>' +
    (state.people.length ? '<ul class="list">' + state.people.map(p => '<li class="orow"><span class="nm">' + esc(p.name) + '</span>' +
      '<button type="button" class="btn soft" data-act="person-me" data-id="' + esc(p.id) + '" aria-pressed="' + (p.id === state.meId) + '">Moi</button>' +
      '<button type="button" class="rm" data-act="person-del" data-id="' + esc(p.id) + '" aria-label="Retirer ' + esc(p.name) + '">' + ICON.x + '</button></li>').join('') + '</ul>' : '') +
    '<div class="join"><input id="newperson" class="field" type="text" maxlength="30" placeholder="Prénom" style="text-transform:none;letter-spacing:0"><button type="submit" class="btn">Ajouter</button></div>' +
    '<button type="button" class="btn soft" data-act="sheet-close" style="min-height:46px">Terminer</button></form>';
  el.hidden = false;
  sheetCfg = {};
  $('#peopleform').addEventListener('submit', ev => {
    ev.preventDefault();
    const name = cap($('#newperson').value.trim());
    if (!name) return;
    const pr = { id:uid(), name, ts:Date.now() };
    state.people.push(pr); pushPerson(pr);
    if (state.people.length === 1 && !state.meId){ state.meId = pr.id; if (!state.me) state.me = pr.name; }
    save(); render(); openPeople();
    setTimeout(() => { const n = $('#newperson'); if (n) n.focus(); }, 30);
  });
}

/* ---------- Clics ---------- */
$('#app').addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-tab]');
  if (!t) return;
  if (t.dataset.tab){ tab = t.dataset.tab; render(); $('#main').scrollTop = 0; return; }
  const a = t.dataset.act, id = t.dataset.id, key = t.dataset.key;
  switch (a){
    case 'toggle': toggle(id); break;
    case 'remove': removeItem(id); break;
    case 'clear-done': {
      const gone = curItems().filter(i => i.done);
      const goneTotal = gone.reduce((a,i) => a + (i.price || 0) * i.qty, 0);
      gone.forEach(i => delItem(i.id));
      state.items = state.items.filter(i => !(i.done && i.listId === state.cur));
      save(); render();
      toast(gone.length + ' ' + plural(gone.length,'article retiré','articles retirés') + ' du caddie', 'Noter la dépense', () => noteExpense(goneTotal));
      break;
    }
    case 'sug-add': { const h = state.history[key]; if (h){ addItem(h.name, h.rayon, 1); render(); } break; }
    case 'sug-dismiss': {
      state.dismissed[key] = Date.now(); save(); render();
      toast('Masqué pendant 7 jours', 'Annuler', () => { delete state.dismissed[key]; save(); render(); });
      break;
    }
    case 'add-chip': addItem(t.dataset.name, t.dataset.rayon, 1); input.value = ''; manualRayon = false; render(); input.focus(); break;
    case 'hist-add': { const h = state.history[key]; if (h){ addItem(h.name, h.rayon, 1); render(); toast(h.name + ' ajouté à la liste'); } break; }
    case 'hist-del': {
      const h = state.history[key]; if (!h) break;
      delete state.history[key]; delHist(key); save(); render();
      toast(h.name + ' oublié', 'Annuler', () => { state.history[key] = h; pushHistFull(key, h); save(); render(); });
      break;
    }
    case 'up': case 'down': {
      const i = +t.dataset.i, j = a === 'up' ? i - 1 : i + 1;
      if (j < 0 || j >= state.order.length) break;
      [state.order[i], state.order[j]] = [state.order[j], state.order[i]];
      save(); fillRayonSelect(); render();
      break;
    }
    case 'edit-item': editItem(id); break;
    case 'note-expense': noteExpense(doneTotal()); break;
    case 'sheet-extra': { const x = sheetCfg && sheetCfg.extras && sheetCfg.extras[+t.dataset.i]; if (x){ closeSheet(); x.onClick(); } break; }
    case 'tpl-del': {
      const tp = state.templates.find(x => x.id === id); if (!tp) break;
      if (confirm('Supprimer le modèle « ' + tp.name + ' » ?')){ state.templates = state.templates.filter(x => x.id !== id); delTemplate(id); save(); render(); toast('Modèle supprimé'); }
      break;
    }
    case 'backup-go': tab = 'settings'; render(); $('#main').scrollTop = 0; break;
    case 'backup-later': state.hintBackup = true; save(); render(); break;
    case 'q-edit': editQuality(key); break;
    case 'q-estimate': estimateMissing(); render(); break;
    case 'q-stop': qCancel = true; break;
    case 'stat-range': state.statRange = t.dataset.r; save(); render(); break;
    case 'grp': state.curGroup = id; state.expCat = 'all'; save(); render(); break;
    case 'new-group': newGroup(); break;
    case 'edit-group': editGroup(); break;
    case 'export-csv': exportExpensesCsv(); break;
    case 'export-buy': exportPurchasesCsv(); break;
    case 'ex-w': {
      const v = document.querySelector('#exform .wv[data-id="' + id + '"]'); if (!v) break;
      const n = Math.max(1, Math.min(9, (parseInt(v.textContent, 10) || 1) + (+t.dataset.d)));
      v.textContent = n;
      const row = t.closest('.shrow'); const sb = row && row.querySelector('[data-act="ex-share"]');
      if (sb && n > 1 && sb.getAttribute('aria-pressed') !== 'true'){ sb.setAttribute('aria-pressed','true'); row.classList.remove('off'); }
      break;
    }
    case 'new-expense': openExpense(); break;
    case 'people': openPeople(); break;
    case 'edit-expense': {
      const e = state.expenses.find(x => x.id === id); if (!e) break;
      if (e.type === 'transfer'){
        if (confirm('Supprimer ce remboursement de ' + eur(e.amt) + ' ?')){ state.expenses = state.expenses.filter(x => x.id !== id); delExpense(id); save(); render(); toast('Remboursement supprimé'); }
      } else openExpense({ expense:e });
      break;
    }
    case 'ex-cat': t.parentNode.querySelectorAll('[data-act="ex-cat"]').forEach(b => b.setAttribute('aria-pressed', String(b === t))); break;
    case 'ex-share': { const on = t.getAttribute('aria-pressed') !== 'true'; t.setAttribute('aria-pressed', String(on)); const r = t.closest('.shrow'); if (r) r.classList.toggle('off', !on); break; }
    case 'exp-filter': state.expCat = t.dataset.cat; save(); render(); break;
    case 'settle': {
      const x = newExpenseObj({ title:'Remboursement', amt:+t.dataset.amt, cat:'Autre', payerId:t.dataset.from, shares:[], type:'transfer', toId:t.dataset.to, date:todayStr() });
      saveExpense(x, true);
      toast('Remboursement noté');
      break;
    }
    case 'person-me': { const pr = state.people.find(x => x.id === id); if (pr){ state.meId = pr.id; state.me = pr.name; save(); openPeople(); } break; }
    case 'person-del': {
      const pr = state.people.find(x => x.id === id); if (!pr) break;
      if (state.expenses.some(e => e.payerId === id || e.toId === id || e.shares.includes(id))){ toast(pr.name + ' apparaît dans des dépenses : impossible de la retirer.'); break; }
      state.people = state.people.filter(x => x.id !== id); delPerson(id);
      if (state.meId === id) state.meId = '';
      save(); render(); openPeople();
      break;
    }
    case 'open-list': goList(id); break;
    case 'back': tab = 'lists'; render(); $('#main').scrollTop = 0; break;
    case 'new-list': newList(t.dataset.folder || null); break;
    case 'new-folder': newFolder(); break;
    case 'edit-list': editList(id); break;
    case 'edit-folder': editFolder(id); break;
    case 'toggle-folder': state.collapsed[id] = !state.collapsed[id]; save(); render(); break;
    case 'sheet-close': case 'scan-close': closeSheet(); break;
    case 'sheet-delete': if (sheetCfg && sheetCfg.onDelete) sheetCfg.onDelete(); break;
    case 'share-create': createHousehold(); break;
    case 'share-join': joinHousehold(($('#joincode') || {}).value); break;
    case 'share-link': shareInvite(); break;
    case 'share-copy': if (state.share) copyText(fmtCode(state.share.code)); break;
    case 'share-leave': leaveHousehold(); break;
    case 'demo': loadDemo(); break;
    case 'export': exportData(); break;
    case 'import': if (state.share) toast('Quittez d’abord le partage pour importer une sauvegarde.'); else $('#file').click(); break;
    case 'reset':
      if (confirm('Effacer la liste, l’historique et les réglages de cet appareil ?' + (state.share ? ' Le lien avec la liste partagée sera aussi supprimé ici ; les autres appareils la gardent.' : ''))){
        stopSync();
        try { localStorage.removeItem(KEY); } catch(err){}
        state = normalizeState({}); fillRayonSelect(); render(); toast('Tout a été effacé');
      }
      break;
  }
});

document.addEventListener('change', e => {
  if (e.target && e.target.id === 'meinput'){ state.me = e.target.value.trim().slice(0,20); save(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target && e.target.id === 'joincode'){ e.preventDefault(); joinHousehold(e.target.value); }
});

/* ---------- Démarrage ---------- */
$('#mic').innerHTML = ICON.mic;
$('#scan').innerHTML = ICON.scan;
$('#addbtn').innerHTML = ICON.plus;
fillRayonSelect();
render();
if (state.share && CFG) startSync();
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
{
  const jp = new URLSearchParams(location.search).get('join');
  if (jp){
    try { history.replaceState(null, '', location.pathname); } catch(e){}
    tab = 'settings'; render();
    const code = cleanCode(jp);
    if (CFG && validCode(code)){
      setTimeout(() => { if (confirm('Rejoindre la liste partagée ' + fmtCode(code) + ' ?')) joinHousehold(code); }, 300);
    } else {
      toast(CFG ? 'Ce lien de partage n’est pas valide.' : 'Le partage n’est pas activé dans cette installation.');
    }
  }
}
window.addEventListener('resize', syncDock);

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
})();
